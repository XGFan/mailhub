# MailHub CI —— 与 temp-mail-hub 同款：test → build(push registry) → Flux image automation(infra 侧) → bark 通知。
# 需要的 Woodpecker secrets：docker_username / docker_password（registry）、bark_token（通知）。
# 镜像 docker.test4x.com/xgfan/mailhub:{<sha8>,latest}；live 跑具体 SHA（k8s 清单里 :latest 仅模板）。
when:
  branch: master
  event: [push, manual]
steps:
  # 注：不在 CI 跑 pnpm install/test —— 集群到 registry.npmjs.org 出网极慢(~1-3 KiB/s，会 fetch failed)。
  # 单元/集成/E2E 测试在本地跑(pnpm -r test + e2e/)，CI 以 build(镜像可编译) 作为门禁。
  - name: build
    image: docker.test4x.com/xgfan/plugin-docker-buildx-check
    settings:
      repo: docker.test4x.com/xgfan/mailhub
      registry: docker.test4x.com
      mirror: https://docker.test4x.com
      tags:
        - "${CI_COMMIT_SHA:0:8}"
        - latest
      mtu: 1450
      cache_from: docker.test4x.com/xgfan/mailhub:cache
      cache_to: docker.test4x.com/xgfan/mailhub:cache
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
  # 把 infra 仓库里该 app 的 image tag 改成本次构建的 sha8 并 push —— 部署由这一步决定。
  # 失败必须让流水线变红(它就是部署本身)。见 infra k8s/apps/woodpecker/plugins/flux-bump.sh。
  - name: flux-bump
    image: docker.test4x.com/xgfan/plugin-flux-bump
    settings:
      repo: docker.test4x.com/xgfan/mailhub
      tag: "${CI_COMMIT_SHA:0:8}"
      ssh_key:
        from_secret: infra_deploy_key
  # 叫 Flux 立刻拉 git(否则等 GitRepository 的 1m 轮询)。agent 是 k8s backend、
  # 跑在集群内,直连 ClusterIP 即可。见 infra k8s/apps/flux2bark/README.md。
  - name: trigger-flux
    image: alpine:3.20
    failure: ignore # webhook 挂了不该让流水线变红
    environment:
      FLUX_URL:
        from_secret: flux_webhook_url
    commands:
      - apk add --no-cache curl >/dev/null
      - curl -sf -X POST "$FLUX_URL" -d '{}' && echo "[flux] git pull triggered"
  - name: notify-success
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: success
  - name: notify-failure
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: failure
    when:
      - status: [failure]
